[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browserbridge-mcp"
version = "2.0.1"
description = "Lightweight HTTP/DOM session bridge, Accessibility Object Model extractor, and SHA-256 action receipt MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "browser", "aom", "automation", "claude", "cursor", "audit-trail"]
dependencies = [
    "httpx>=0.25.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
browserbridge-mcp = "browserbridge.cli:main"
browserbridge = "browserbridge.cli:main"

[tool.setuptools.packages.find]
include = ["browserbridge*"]

[tool.pytest.ini_options]
pythonpath = ["."]

[project.urls]
Homepage = "https://github.com/johannschiffer/browserbridge-mcp"
Documentation = "https://github.com/johannschiffer/browserbridge-mcp#readme"
Repository = "https://github.com/johannschiffer/browserbridge-mcp"
Issues = "https://github.com/johannschiffer/browserbridge-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
