[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browserbridge-mcp"
version = "1.0.4"
description = "Headless Browser Session Bridge & Accessibility DOM Inspector for AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "browser", "headless", "automation", "claude", "cursor", "playwright"]
dependencies = [
    "httpx>=0.25.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
browserbridge-mcp = "browserbridge.cli:main"
browserbridge = "browserbridge.cli:main"

[tool.setuptools.packages.find]
include = ["browserbridge*"]

[project.urls]
Funding = "https://github.com/sponsors/johannschiffer"
Homepage = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/browserbridge-mcp"
"Starter Kit" = "https://johanld.gumroad.com/l/genesis-starter-kit"
"Enterprise Suite" = "https://johanld.gumroad.com/l/genesis-enterprise-suite/EARLYACCESS"
