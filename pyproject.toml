[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browserbridge-mcp"
version = "2.0.0"
description = "Headless browser automation, durable action receipts, and session pooling MCP server for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Johann Schiffer"}
]
keywords = ["mcp", "model-context-protocol", "browser", "headless", "automation", "claude", "cursor", "playwright"]
dependencies = [
    "httpx>=0.25.0"
]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
browserbridge-mcp = "browserbridge.cli:main"
browserbridge = "browserbridge.cli:main"

[tool.setuptools.packages.find]
include = ["browserbridge*"]

[project.urls]
Homepage = "https://johannschiffer.github.io"
Documentation = "https://johannschiffer.github.io"
Repository = "https://github.com/johannschiffer/browserbridge-mcp"
Issues = "https://github.com/johannschiffer/browserbridge-mcp/issues"
Funding = "https://ko-fi.com/johannschiffer"
