services:
  browserbridge:
    build: .
    container_name: genesis-browserbridge
    restart: unless-stopped
    stdin_open: true
    tty: true
    security_opt: ["no-new-privileges:true"]
    environment:
      PYTHONUNBUFFERED: "1"
      BROWSERBRIDGE_DB_PATH: /data/receipts.db
    volumes:
      - browserbridge_data:/data

volumes:
  browserbridge_data:
